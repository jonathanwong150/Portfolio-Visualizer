services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:5173
    volumes:
      - ./backend/app:/app/app

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ./frontend/src:/app/src

  # Postgres is scaffolded for Phase 3 (live sync + snapshots).
  # The prototype runs entirely on seed/mock data and does not require it yet.
